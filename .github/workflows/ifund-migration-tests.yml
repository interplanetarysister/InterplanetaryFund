name: IFund migration tests

on:
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - "apps/web/src/**"
      - "apps/web/tests/**"
      - "tests/**"
      - "scripts/**"
      - "docs/migration/**"
      - "supabase/migrations/pending/**"
      - ".github/workflows/ifund-migration-tests.yml"
  push:
    branches: [migration/build-completeness-gates-20261029]
    paths:
      - "worker/**"
      - "apps/web/src/**"
      - "apps/web/tests/**"
      - "tests/**"
      - "scripts/**"
      - "docs/migration/**"
      - "supabase/migrations/pending/**"
      - ".github/workflows/ifund-migration-tests.yml"

permissions:
  contents: read

jobs:
  migration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Install locked root test dependencies
        run: npm ci --no-audit --no-fund
      - name: Run independent worker and contract tests
        run: node --test tests/*.test.js
      - name: Run web regression tests and offline coverage audits
        run: npm --prefix apps/web test

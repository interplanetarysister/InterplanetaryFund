name: IFund migration static checks (no build or deployment)

on:
  pull_request:
    branches: [main, migration/supabase-cloudflare, migration/build-completeness-gates-20261029]
    paths:
      - "worker/**"
      - "apps/web/**"
      - "vite.config.js"
      - "index.html"
      - "public/**"
      - "tests/**"
      - "scripts/**"
      - "docs/migration/**"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/schema.sql"
      - "functions/**"
      - "d1/**"
      - "wrangler.automations.jsonc"
      - "wrangler.notifications.jsonc"
      - "wrangler.jsonc"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - "apps/web/package.json"
      - "apps/web/package-lock.json"
      - ".github/workflows/**"
  push:
    branches: [migration/build-completeness-gates-20261029, migration/supabase-cloudflare]
    paths:
      - "worker/**"
      - "apps/web/**"
      - "vite.config.js"
      - "index.html"
      - "public/**"
      - "tests/**"
      - "scripts/**"
      - "docs/migration/**"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/schema.sql"
      - "functions/**"
      - "d1/**"
      - "wrangler.automations.jsonc"
      - "wrangler.notifications.jsonc"
      - "wrangler.jsonc"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - "apps/web/package.json"
      - "apps/web/package-lock.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  migration-static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Install locked root test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run independent worker and contract tests
        run: node --test tests/*.test.js
      - name: Install locked independent web test dependencies without lifecycle scripts
        run: npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund
      - name: Run web regression tests and offline coverage audits
        run: npm --prefix apps/web test
      - name: Syntax-check Worker JavaScript without compiling
        run: |
          for file in worker/*.js; do
            node --check "$file"
          done

name: IFund migration tests

on:
  pull_request:
    branches: [main, migration/supabase-cloudflare, migration/build-completeness-gates-20261029]
    paths:
      - "worker/**"
      - "apps/web/**"
      - "vite.config.js"
      - "index.html"
      - "public/**"
      - "tests/**"
      - "scripts/**"
      - "docs/migration/**"
      - "supabase/migrations/**"
      - "functions/**"
      - "d1/**"
      - "wrangler.automations.jsonc"
      - "wrangler.jsonc"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ifund-migration-tests.yml"
  push:
    branches: [migration/build-completeness-gates-20261029, migration/supabase-cloudflare]
    paths:
      - "worker/**"
      - "apps/web/**"
      - "vite.config.js"
      - "index.html"
      - "public/**"
      - "tests/**"
      - "scripts/**"
      - "docs/migration/**"
      - "supabase/migrations/**"
      - "functions/**"
      - "d1/**"
      - "wrangler.automations.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ifund-migration-tests.yml"

permissions:
  contents: read

jobs:
  migration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Install locked root test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run independent worker and contract tests
        run: node --test tests/*.test.js
      - name: Install locked independent web app dependencies without lifecycle scripts
        run: npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund
      - name: Run web regression tests and offline coverage audits
        run: npm --prefix apps/web test
      - name: Compile the independent web app for repair verification
        run: npm --prefix apps/web exec -- vite build

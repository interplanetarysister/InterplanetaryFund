name: IFund New Android App Candidate

# New application ID: com.interplanetaryfund.app. Not the legacy Base44 APK.
# Build only by manual dispatch; no automatic deploy/store upload.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check independent native identity before build
        run: node apps/mobile/scripts/verify-mobile.mjs --candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Test and build bundled canonical frontend
        working-directory: apps/web
        env:
          VITE_SUPABASE_URL: https://ssibsfmtodgximseeqsv.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "Missing canonical publishable build variable"; exit 1; }
          npm ci --no-audit --no-fund
          npm test
          npm run build
          test -s dist/index.html
      - name: Prepare separate mobile project
        working-directory: apps/mobile
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#0b1824' --splashBackgroundColor '#0b1824'
          npx cap sync android
      - name: Verify native ID is NOT the Base44 APK
        working-directory: apps/mobile
        run: |
          grep -q '"appId": "com.interplanetaryfund.app"' capacitor.config.json
          ! grep -q 'com.base6a67a778342a8fe05ee79cba.app' capacitor.config.json
      - name: Assemble unsigned-for-store debug test APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IFund-New-Android-Debug-Only
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

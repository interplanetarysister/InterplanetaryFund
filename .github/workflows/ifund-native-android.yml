name: IFund New Android App Candidate

# New application ID: com.interplanetaryfund.app. Not the legacy Base44 APK.
# Build only by manual dispatch; no automatic deploy/store upload.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check independent native identity before build
        run: node apps/mobile/scripts/verify-mobile.mjs --candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Test and build bundled canonical frontend
        working-directory: apps/web
        env:
          VITE_SUPABASE_URL: https://ssibsfmtodgximseeqsv.supabase.co
          VITE_SUPABASE_OAUTH_PROVIDERS: ${{ vars.VITE_SUPABASE_OAUTH_PROVIDERS || '' }}
          VITE_NATIVE_OAUTH_VERIFIED: ${{ vars.VITE_NATIVE_OAUTH_VERIFIED || '0' }}
          VITE_NATIVE_APPLE_SIGNIN_READY: ${{ vars.VITE_NATIVE_APPLE_SIGNIN_READY || '0' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_x9AX2hyHLr_kb2mewuH69Q_T66poFyL' }}
        run: |
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "Missing canonical publishable build variable"; exit 1; }
          npm ci --no-audit --no-fund
          npm test
          npm run build
          test -s dist/index.html
      - name: Prepare separate mobile project
        working-directory: apps/mobile
        run: |
          npm install --package-lock-only --no-audit --no-fund
          npm ci --no-audit --no-fund
          npx cap add android
          node scripts/configure-native-project.mjs android
          npx @capacitor/assets generate --android --iconBackgroundColor '#0b1824' --splashBackgroundColor '#0b1824'
          npx cap sync android
      - name: Verify native ID is NOT the Base44 APK
        working-directory: apps/mobile
        run: |
          grep -q '"appId": "com.interplanetaryfund.app"' capacitor.config.json
          ! grep -q 'com.base6a67a778342a8fe05ee79cba.app' capacitor.config.json
      - name: Assemble unsigned-for-store debug test APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug
      - name: Compile unsigned Android App Bundle candidate
        working-directory: apps/mobile/android
        run: |
          ./gradlew bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab
          echo "This AAB is unsigned and is NOT Play Store installable."
      - uses: actions/upload-artifact@v4
        with:
          name: IFund-Android-Test-APK-and-Unsigned-AAB
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
            apps/mobile/package-lock.json
          if-no-files-found: error
          retention-days: 14

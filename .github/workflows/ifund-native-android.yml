name: IFund New Android App Candidate

# New application ID: com.interplanetaryfund.app. Not the legacy Base44 APK.
# Build only by manual dispatch; no automatic deploy/store upload.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Verify existing web source tests
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Prepare separate mobile project
        working-directory: apps/mobile
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Verify native ID is NOT the Base44 APK
        working-directory: apps/mobile
        run: |
          grep -q '"appId": "com.interplanetaryfund.app"' capacitor.config.json
          ! grep -q 'com.base6a67a778342a8fe05ee79cba.app' capacitor.config.json
      - name: Assemble unsigned-for-store debug test APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IFund-New-Android-Debug-Only
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: PR 99 Local Convex Runtime Matrix

on:
  push:
    branches:
      - agent1/p0-convex-durable-claim-current-main-r13
    paths:
      - '.github/workflows/pr99-local-convex-runtime.yml'

permissions:
  contents: read

jobs:
  runtime-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent1/p0-convex-durable-claim-current-main-r13
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start anonymous local Convex backend
        shell: bash
        run: |
          set -euo pipefail
          export CONVEX_AGENT_MODE=anonymous
          nohup npx convex dev > /tmp/convex-dev.log 2>&1 &
          echo $! > /tmp/convex-dev.pid
          for i in $(seq 1 90); do
            if grep -q "Convex functions ready" /tmp/convex-dev.log; then
              cat .env.local
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/convex-dev.pid)" 2>/dev/null; then
              cat /tmp/convex-dev.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/convex-dev.log
          exit 1
      - name: Concurrent first provisioning converges to one record
        shell: bash
        run: |
          set -euo pipefail
          npx convex run automationProvisioning:provisionAutomationLaneLock '{}' > /tmp/provision-a.txt 2>&1 & p1=$!
          npx convex run automationProvisioning:provisionAutomationLaneLock '{}' > /tmp/provision-b.txt 2>&1 & p2=$!
          wait $p1
          wait $p2
          cat /tmp/provision-a.txt
          cat /tmp/provision-b.txt
          npx convex run automationProvisioning:getAutomationLaneLockStatus '{}' > /tmp/lock-status.txt
          cat /tmp/lock-status.txt
          grep -q '"initialized": true' /tmp/lock-status.txt
          grep -q '"recordCount": 1' /tmp/lock-status.txt
      - name: Concurrent claims produce exactly one winner
        shell: bash
        run: |
          set -euo pipefail
          now_ms=$(node -e 'process.stdout.write(String(Date.now()))')
          npx convex run automationCoordinator:claimAutomationLane "{\"token\":\"agent2-runtime-a\",\"nowMs\":$now_ms}" > /tmp/claim-a.txt 2>&1 & p1=$!
          npx convex run automationCoordinator:claimAutomationLane "{\"token\":\"agent3-runtime-b\",\"nowMs\":$now_ms}" > /tmp/claim-b.txt 2>&1 & p2=$!
          wait $p1
          wait $p2
          cat /tmp/claim-a.txt
          cat /tmp/claim-b.txt
          winners=$(grep -hxc 'true' /tmp/claim-a.txt /tmp/claim-b.txt || true)
          losers=$(grep -hxc 'false' /tmp/claim-a.txt /tmp/claim-b.txt || true)
          test "$winners" -eq 1
          test "$losers" -eq 1
          npx convex run automationCoordinator:releaseAutomationLane "{\"token\":\"agent2-runtime-a\",\"nowMs\":$now_ms}" || true
          npx convex run automationCoordinator:releaseAutomationLane "{\"token\":\"agent3-runtime-b\",\"nowMs\":$now_ms}" || true
      - name: Stale owner is fenced and fresh owner can retry safely
        shell: bash
        run: |
          set -euo pipefail
          # Claim at epoch 0: the stored lease is immediately stale in real time.
          npx convex run automationCoordinator:claimAutomationLane '{"token":"stale-owner","nowMs":0}' | tee /tmp/stale-claim.txt
          grep -qx 'true' /tmp/stale-claim.txt

          set +e
          npx convex run autonomous:checkSiteHealth '{"claimToken":"stale-owner"}' > /tmp/stale-write.txt 2>&1
          stale_rc=$?
          set -e
          cat /tmp/stale-write.txt
          test "$stale_rc" -ne 0
          grep -q 'automation_lane_stale_owner' /tmp/stale-write.txt

          now_ms=$(node -e 'process.stdout.write(String(Date.now()))')
          npx convex run automationCoordinator:claimAutomationLane "{\"token\":\"fresh-owner\",\"nowMs\":$now_ms}" | tee /tmp/fresh-claim.txt
          grep -qx 'true' /tmp/fresh-claim.txt
          npx convex run autonomous:checkSiteHealth '{"claimToken":"fresh-owner"}' > /tmp/fresh-write.txt
          cat /tmp/fresh-write.txt
          grep -q '"status": "success"' /tmp/fresh-write.txt
          npx convex run automationCoordinator:releaseAutomationLane "{\"token\":\"fresh-owner\",\"nowMs\":$now_ms}" > /tmp/fresh-release.txt
          grep -qx 'true' /tmp/fresh-release.txt
      - name: Manual duplicate lane invocation exits before child writes
        shell: bash
        run: |
          set -euo pipefail
          now_ms=$(node -e 'process.stdout.write(String(Date.now()))')
          npx convex run automationCoordinator:claimAutomationLane "{\"token\":\"manual-blocker\",\"nowMs\":$now_ms}" > /tmp/manual-claim.txt
          grep -qx 'true' /tmp/manual-claim.txt
          npx convex run automationCoordinator:runSerializedAutomation '{}' > /tmp/duplicate-run.txt
          cat /tmp/duplicate-run.txt
          grep -q '"skipped": true' /tmp/duplicate-run.txt
          grep -q '"reason": "already_running"' /tmp/duplicate-run.txt
          npx convex run automationCoordinator:releaseAutomationLane "{\"token\":\"manual-blocker\",\"nowMs\":$now_ms}" > /tmp/manual-release.txt
          grep -qx 'true' /tmp/manual-release.txt
      - name: Final source and production build gates
        run: |
          npm run verify:automation-serialization
          npm run verify:automation-provisioning
          npx tsc --noEmit
          npm run build
      - name: Show Convex log on failure
        if: failure()
        run: cat /tmp/convex-dev.log || true

name: IFund isolated private-document security tests

# Source acceptance only. Never builds, deploys, publishes, or uses secrets.
# Existing manual Pages release gate remains unchanged.
# GitHub-hosted runners unavailable through November 2026. No push-triggered
# jobs; keep the suite available for explicit dispatch after runner capacity returns.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ifund-private-document-source-tests
  cancel-in-progress: true

jobs:
  private-data-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked root dependencies
        run: npm ci --no-audit --no-fund
      - name: Execute real Postgres-in-WASM and Worker tests (no build)
        run: |
          set -euo pipefail
          node --test \
            tests/campaign-documents-db.test.js \
            tests/private-document-erasure.test.js \
            tests/team-context-db.test.js \
            tests/team-context-worker.test.js \
            2>&1 | tee /tmp/ifund-private-document-root.log
      - name: Execute web document contract tests (no build)
        run: |
          set -euo pipefail
          node --test \
            apps/web/tests/campaign-documents.test.js \
            apps/web/tests/campaign-document-privacy-notice.test.js \
            apps/web/tests/campaign-document-permissions.test.js \
            apps/web/tests/campaign-document-orphan-recovery.test.js \
            apps/web/tests/document-reference-safety.test.js \
            2>&1 | tee /tmp/ifund-private-document-web.log
      - name: Verify campaign creator interruption recovery and agent handoff (no build)
        run: |
          set -euo pipefail
          node --test apps/web/tests/campaign-creation-recovery.test.mjs 2>&1 | tee /tmp/ifund-campaign-creator-recovery.log
      - name: Preserve test logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ifund-private-document-source-qa
          path: |
            /tmp/ifund-private-document-root.log
            /tmp/ifund-private-document-web.log
            /tmp/ifund-campaign-creator-recovery.log
          if-no-files-found: ignore
          retention-days: 7

name: Original frontend Cloudflare preview
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact 40-character original Base44 source commit SHA'
        required: true
        type: string
permissions:
  contents: read
jobs:
  original-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate immutable source revision
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if ! [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'Provide an exact 40-character source commit SHA, not a moving branch or tag.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: interplanetarysister/interplanetary-fund2
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.IFUND_SOURCE_READ_TOKEN || github.token }}
      - name: Record exact original-source revision
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "${ACTUAL_SHA,,}" = "${SOURCE_REF,,}" || { echo 'Checked-out source does not match requested SHA' >&2; exit 1; }
          echo "Original Base44 frontend source: interplanetarysister/interplanetary-fund2@$ACTUAL_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview-only: Base44 runtime retained; no production promotion." >> "$GITHUB_STEP_SUMMARY"
          if test -n "$(git status --porcelain)"; then
            echo 'Original source checkout is unexpectedly modified before build' >&2
            git status --short >&2
            exit 1
          fi
      - name: Require Base44 configuration before building
        env:
          VITE_BASE44_APP_BASE_URL: ${{ vars.VITE_BASE44_APP_BASE_URL }}
          VITE_BASE44_APP_ID: ${{ vars.VITE_BASE44_APP_ID }}
        run: |
          test -n "$VITE_BASE44_APP_BASE_URL" || { echo 'Missing VITE_BASE44_APP_BASE_URL'; exit 1; }
          test -n "$VITE_BASE44_APP_ID" || { echo 'Missing VITE_BASE44_APP_ID'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install original frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build original frontend, retaining Base44 runtime
        run: npm run build
        env:
          VITE_BASE44_APP_BASE_URL: ${{ vars.VITE_BASE44_APP_BASE_URL }}
          VITE_BASE44_APP_ID: ${{ vars.VITE_BASE44_APP_ID }}
      - name: Verify frontend artifact
        run: |
          test -s dist/index.html
          # Pages serves index.html for SPA routes when no top-level 404.html exists.
          # Never inject the catch-all rewrite that previously caused redirect loops.
          test ! -e dist/404.html || { echo '404.html disables Pages native SPA fallback' >&2; exit 1; }
          test ! -e dist/_redirects || { echo 'Unexpected redirect rules in original artifact' >&2; exit 1; }
          test -d dist/assets
          grep -q 'viewport-fit=cover' dist/index.html
          grep -q 'Interplanetary Fund' dist/index.html
          test -s dist/manifest.json
          test -s dist/favicon.jpg
          test -s dist/apple-touch-icon.jpg
          find dist/assets -type f -name '*.js' -size +0c | grep -q .
      - name: Stamp immutable preview provenance
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          printf '{"source_repository":"interplanetarysister/interplanetary-fund2","source_commit":"%s","runtime":"base44-preserved","release":"preview-only"}\n' "$SOURCE_REF" > dist/ifund-source.json
          test -s dist/ifund-source.json
      - name: Publish isolated Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@3 pages deploy dist --project-name interplanetaryfund-migration --branch original-frontend-preview --commit-dirty=true | tee /tmp/ifund-pages-deploy.log
          echo "Original-source Cloudflare preview deployment output:" >> "$GITHUB_STEP_SUMMARY"
          grep -Eo 'https://[[:alnum:].-]+\.pages\.dev' /tmp/ifund-pages-deploy.log | sort -u >> "$GITHUB_STEP_SUMMARY" || true
          echo "Deployment success does not establish visual or Base44 runtime parity; browser QA is still required." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify live preview provenance and deep links
        run: |
          set -euo pipefail
          PREVIEW_URL="$(grep -Eo 'https://[[:alnum:].-]+\.pages\.dev' /tmp/ifund-pages-deploy.log | head -n 1 || true)"
          test -n "$PREVIEW_URL" || { echo 'Cloudflare returned no preview URL' >&2; exit 1; }
          echo "Checking deployed preview at $PREVIEW_URL"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 20 "$PREVIEW_URL/ifund-source.json" -o /tmp/ifund-live-source.json; then
              break
            fi
            sleep 5
          done
          SOURCE_REF="${{ inputs.source_ref }}" node --input-type=module -e '
            import fs from "node:fs";
            const p = JSON.parse(fs.readFileSync("/tmp/ifund-live-source.json", "utf8"));
            if (p.source_repository !== "interplanetarysister/interplanetary-fund2" ||
                p.source_commit.toLowerCase() !== process.env.SOURCE_REF.toLowerCase() ||
                p.runtime !== "base44-preserved" || p.release !== "preview-only") {
              throw Error("Live preview provenance mismatch");
            }
          '
          curl --fail --silent --show-error --location --max-time 20 "$PREVIEW_URL/" -o /tmp/ifund-live-home.html
          grep -qi '<html' /tmp/ifund-live-home.html
          # A Pages fallback can return index.html for missing assets. Confirm the
          # deployed HTML points to actual JavaScript, not a 200 HTML fallback.
          PREVIEW_URL="$PREVIEW_URL" node --input-type=module -e '
            import fs from "node:fs";
            const html = fs.readFileSync("/tmp/ifund-live-home.html", "utf8");
            const scripts = [...html.matchAll(/<script\b[^>]*\bsrc=["\x27]([^"\x27]+)["\x27]/gi)].map(m => m[1]);
            if (!scripts.length) throw Error("No script assets in deployed homepage");
            const origin = new URL(process.env.PREVIEW_URL);
            for (const script of scripts) {
              const url = new URL(script, origin);
              if (url.origin !== origin.origin) throw Error("Unexpected external entrypoint: " + url);
            }
            fs.writeFileSync("/tmp/ifund-live-scripts.txt", scripts.join("\n") + "\n");
          '
          while IFS= read -r asset; do
            test -n "$asset" || continue
            ASSET_URL="$(PREVIEW_URL="$PREVIEW_URL" ASSET="$asset" node -e 'console.log(new URL(process.env.ASSET, process.env.PREVIEW_URL).href)')"
            # Cloudflare SPA fallback can return 200 text/html for a missing
            # script. Reject it using response headers as well as body content.
            curl --fail --silent --show-error --location --max-time 20 -D /tmp/ifund-live-asset.headers "$ASSET_URL" -o /tmp/ifund-live-asset.js
            if ! grep -Eiq '^content-type:[[:space:]]*(application|text)/(javascript|x-javascript|ecmascript)' /tmp/ifund-live-asset.headers; then
              echo "Script did not return a JavaScript Content-Type: $ASSET_URL" >&2
              exit 1
            fi
            if head -c 256 /tmp/ifund-live-asset.js | grep -Eiq '<!doctype|<html'; then
              echo "Script returned HTML fallback: $ASSET_URL" >&2
              exit 1
            fi
            test -s /tmp/ifund-live-asset.js
          done < /tmp/ifund-live-scripts.txt
          # Verify stylesheet assets too: an SPA fallback can mask a missing CSS
          # bundle while the homepage and JavaScript checks still pass.
          PREVIEW_URL="$PREVIEW_URL" node --input-type=module -e '
            import fs from "node:fs";
            const html = fs.readFileSync("/tmp/ifund-live-home.html", "utf8");
            const links = [...html.matchAll(/<link\b[^>]*>/gi)].map(m => m[0]);
            const css = links.filter(tag => /\brel=["\x27]stylesheet["\x27]/i.test(tag))
              .map(tag => tag.match(/\bhref=["\x27]([^"\x27]+)["\x27]/i)?.[1])
              .filter(Boolean);
            if (!css.length) throw Error("No stylesheet assets in deployed homepage");
            const origin = new URL(process.env.PREVIEW_URL);
            for (const asset of css) {
              const url = new URL(asset, origin);
              if (url.origin !== origin.origin) throw Error("Unexpected external stylesheet: " + url);
            }
            fs.writeFileSync("/tmp/ifund-live-styles.txt", css.join("\n") + "\n");
          '
          while IFS= read -r asset; do
            test -n "$asset" || continue
            ASSET_URL="$(PREVIEW_URL="$PREVIEW_URL" ASSET="$asset" node -e 'console.log(new URL(process.env.ASSET, process.env.PREVIEW_URL).href)')"
            curl --fail --silent --show-error --location --max-time 20 -D /tmp/ifund-live-style.headers "$ASSET_URL" -o /tmp/ifund-live-style.css
            grep -Eiq '^content-type:[[:space:]]*text/css' /tmp/ifund-live-style.headers || { echo "Stylesheet did not return CSS: $ASSET_URL" >&2; exit 1; }
            test -s /tmp/ifund-live-style.css
            if head -c 256 /tmp/ifund-live-style.css | grep -Eiq '<!doctype|<html'; then
              echo "Stylesheet returned HTML fallback: $ASSET_URL" >&2
              exit 1
            fi
          done < /tmp/ifund-live-styles.txt
          # Probe canonical public/deep-link routes; this is transport validation,
          # not a substitute for rendered browser or Base44 API acceptance tests.
          for route in login create discover; do
            curl --fail --silent --show-error --location --max-time 20 \
              "$PREVIEW_URL/$route" -o "/tmp/ifund-live-${route}.html"
            grep -qi '<html' "/tmp/ifund-live-${route}.html" || {
              echo "Missing SPA document at /$route" >&2
              exit 1
            }
            # SPA deep links must serve the same app shell, not an unrelated
            # error/login document that happens to contain an html tag.
            if ! cmp -s /tmp/ifund-live-home.html "/tmp/ifund-live-${route}.html"; then
              echo "Deep link /$route did not serve the original SPA entry document" >&2
              exit 1
            fi
          done
          # Confirm original install assets are served as files, not SPA HTML fallbacks.
          for asset in manifest.json favicon.jpg apple-touch-icon.jpg; do
            curl --fail --silent --show-error --location --max-time 20 \
              -D /tmp/ifund-install.headers "$PREVIEW_URL/$asset" \
              -o /tmp/ifund-install.asset
            test -s /tmp/ifund-install.asset
            if head -c 256 /tmp/ifund-install.asset | grep -Eiq '<!doctype|<html'; then
              echo "Install asset returned SPA HTML fallback: $asset" >&2
              exit 1
            fi
            case "$asset" in
              manifest.json)
                node -e 'JSON.parse(require("node:fs").readFileSync("/tmp/ifund-install.asset","utf8"))'
                ;;
              *.jpg)
                node -e '
                  const fs = require("node:fs");
                  const b = fs.readFileSync("/tmp/ifund-install.asset");
                  if (b.length < 4 || b[0] !== 0xff || b[1] !== 0xd8 || b[2] !== 0xff) {
                    throw Error("Original JPEG install asset has invalid bytes");
                  }
                '
                ;;
            esac
          done
          echo "Verified deployed source provenance and SPA login/create/discover deep links at $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Browser visual parity, login and Base44 campaign API flows still require interactive verification." >> "$GITHUB_STEP_SUMMARY"

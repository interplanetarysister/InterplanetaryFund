name: Original frontend Cloudflare preview
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact 40-character original Base44 source commit SHA'
        required: true
        type: string
permissions:
  contents: read
jobs:
  original-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate immutable source revision
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if ! [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'Provide an exact 40-character source commit SHA, not a moving branch or tag.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: interplanetarysister/interplanetary-fund2
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.IFUND_SOURCE_READ_TOKEN || github.token }}
      - name: Record exact original-source revision
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "${ACTUAL_SHA,,}" = "${SOURCE_REF,,}" || { echo 'Checked-out source does not match requested SHA' >&2; exit 1; }
          echo "Original Base44 frontend source: interplanetarysister/interplanetary-fund2@$ACTUAL_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview-only: Base44 runtime retained; no production promotion." >> "$GITHUB_STEP_SUMMARY"
          git status --porcelain
      - name: Require Base44 configuration before building
        env:
          VITE_BASE44_APP_BASE_URL: ${{ vars.VITE_BASE44_APP_BASE_URL }}
          VITE_BASE44_APP_ID: ${{ vars.VITE_BASE44_APP_ID }}
        run: |
          test -n "$VITE_BASE44_APP_BASE_URL" || { echo 'Missing VITE_BASE44_APP_BASE_URL'; exit 1; }
          test -n "$VITE_BASE44_APP_ID" || { echo 'Missing VITE_BASE44_APP_ID'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install original frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build original frontend, retaining Base44 runtime
        run: npm run build
        env:
          VITE_BASE44_APP_BASE_URL: ${{ vars.VITE_BASE44_APP_BASE_URL }}
          VITE_BASE44_APP_ID: ${{ vars.VITE_BASE44_APP_ID }}
      - name: Add Cloudflare SPA deep-link fallback
        run: |
          # Original source has no public/_redirects. Preserve its code and
          # generate a Pages-only fallback for client-side routes.
          printf '/* /index.html 200\n' > dist/_redirects
      - name: Verify frontend artifact
        run: |
          test -s dist/index.html
          grep -Fxq '/* /index.html 200' dist/_redirects
          test -d dist/assets
          grep -q 'viewport-fit=cover' dist/index.html
          grep -q 'Interplanetary Fund' dist/index.html
          test -s dist/manifest.json
          test -s dist/favicon.jpg
          test -s dist/apple-touch-icon.jpg
          find dist/assets -type f -name '*.js' -size +0c | grep -q .
      - name: Stamp immutable preview provenance
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          printf '{"source_repository":"interplanetarysister/interplanetary-fund2","source_commit":"%s","runtime":"base44-preserved","release":"preview-only"}\n' "$SOURCE_REF" > dist/ifund-source.json
          test -s dist/ifund-source.json
      - name: Publish isolated Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy dist --project-name interplanetaryfund-migration --branch original-frontend-preview --commit-dirty=true | tee /tmp/ifund-pages-deploy.log
          echo "Original-source Cloudflare preview deployment output:" >> "$GITHUB_STEP_SUMMARY"
          grep -Eo 'https://[[:alnum:].-]+\.pages\.dev' /tmp/ifund-pages-deploy.log | sort -u >> "$GITHUB_STEP_SUMMARY" || true
          echo "Deployment success does not establish visual or Base44 runtime parity; browser QA is still required." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify live preview provenance and deep links
        run: |
          set -euo pipefail
          PREVIEW_URL="$(grep -Eo 'https://[[:alnum:].-]+\\.pages\\.dev' /tmp/ifund-pages-deploy.log | head -n 1 || true)"
          test -n "$PREVIEW_URL" || { echo 'Cloudflare returned no preview URL' >&2; exit 1; }
          echo "Checking deployed preview at $PREVIEW_URL"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 20 "$PREVIEW_URL/ifund-source.json" -o /tmp/ifund-live-source.json; then
              break
            fi
            sleep 5
          done
          SOURCE_REF="${{ inputs.source_ref }}" node --input-type=module -e '
            import fs from "node:fs";
            const p = JSON.parse(fs.readFileSync("/tmp/ifund-live-source.json", "utf8"));
            if (p.source_repository !== "interplanetarysister/interplanetary-fund2" ||
                p.source_commit.toLowerCase() !== process.env.SOURCE_REF.toLowerCase() ||
                p.runtime !== "base44-preserved" || p.release !== "preview-only") {
              throw Error("Live preview provenance mismatch");
            }
          '
          curl --fail --silent --show-error --location --max-time 20 "$PREVIEW_URL/" -o /tmp/ifund-live-home.html
          grep -qi '<html' /tmp/ifund-live-home.html
          curl --fail --silent --show-error --location --max-time 20 "$PREVIEW_URL/login" -o /tmp/ifund-live-login.html
          grep -qi '<html' /tmp/ifund-live-login.html
          echo "Verified deployed source provenance and SPA login deep-link at $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Browser visual parity, login and Base44 campaign API flows still require interactive verification." >> "$GITHUB_STEP_SUMMARY"

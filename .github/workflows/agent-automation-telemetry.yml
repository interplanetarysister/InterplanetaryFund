name: Agent Automation Telemetry Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: agent-automation-telemetry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Detect public telemetry exposure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Verify telemetry boundary
        run: npm run verify:agent-automation-telemetry

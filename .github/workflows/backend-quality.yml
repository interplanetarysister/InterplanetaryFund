name: Backend Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent1/automation-concurrency-current-main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@v4
        with:
          # pull_request normally checks out GitHub's synthetic merge ref.
          # Security/quality gates must execute against the actual PR head so
          # an older merge-ref verifier cannot produce a false result.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Automation concurrency verification
        run: npm run verify:automation-concurrency
      - name: Convex typecheck
        run: npx tsc --noEmit -p tsconfig.convex.json
      - name: Production build
        run: npm run build

name: Backend Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent1/automation-concurrency-repair]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      # Convex codegen may legitimately require a selected deployment because
      # project configuration can be evaluated through the Convex runtime.
      # CI does not have a Development deployment credential by design. The
      # committed convex/_generated output is therefore validated indirectly by
      # the full TypeScript check below. Deployment-specific codegen/runtime
      # validation remains a separate Development gate before promotion.
      - name: Automation concurrency verification
        run: npm run verify:automation-concurrency

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

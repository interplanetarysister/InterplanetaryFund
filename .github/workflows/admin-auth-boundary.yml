name: Admin auth boundary

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "convex/adminUsers.ts"
      - "convex/auth.ts"
      - "convex/schema.ts"
      - "convex/security.ts"
      - "scripts/verify-admin-auth-boundary.mjs"
      - ".github/workflows/admin-auth-boundary.yml"

permissions:
  contents: read

concurrency:
  group: admin-auth-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify admin authorization boundary
        run: npm run test:admin-auth-boundary

      - name: Typecheck current source
        run: npx tsc --noEmit

      - name: Build production application
        run: npm run build

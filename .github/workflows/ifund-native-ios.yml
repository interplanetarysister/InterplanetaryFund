name: IFund New iOS App Simulator Candidate

# Separate iOS app com.interplanetaryfund.app. Simulator-only build; not an IPA.
# Manual trigger only. Requires macOS runner, Xcode; no distribution signing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator-candidate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm Capacitor 8 build Xcode is supported
        run: |
          xcodebuild -version
          version="$(xcodebuild -version | awk '/^Xcode /{print $2}')"
          test -n "$version"
          major="${version%%.*}"
          if [ "$major" -lt 26 ]; then
            echo "Capacitor 8 requires Xcode 26 or later."
            exit 1
          fi
      - name: Check independent native identity before build
        run: node apps/mobile/scripts/verify-mobile.mjs --candidate
      - name: Test and build bundled canonical frontend
        working-directory: apps/web
        env:
          VITE_SUPABASE_URL: https://ssibsfmtodgximseeqsv.supabase.co
          VITE_SUPABASE_OAUTH_PROVIDERS: ${{ vars.VITE_SUPABASE_OAUTH_PROVIDERS || '' }}
          VITE_NATIVE_OAUTH_VERIFIED: ${{ vars.VITE_NATIVE_OAUTH_VERIFIED || '0' }}
          VITE_NATIVE_APPLE_SIGNIN_READY: ${{ vars.VITE_NATIVE_APPLE_SIGNIN_READY || '0' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_x9AX2hyHLr_kb2mewuH69Q_T66poFyL' }}
        run: |
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "Missing canonical publishable build variable"; exit 1; }
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm test
          npm run build
          test -s dist/index.html
      - name: Prepare separate iOS project
        working-directory: apps/mobile
        run: |
          npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund
          npm ci --legacy-peer-deps --no-audit --no-fund
          npx cap add ios
          node scripts/configure-native-project.mjs ios
          npx @capacitor/assets generate --ios --iconBackgroundColor '#0b1824' --splashBackgroundColor '#0b1824'
          npx cap sync ios
      - name: Confirm independent bundle identity
        working-directory: apps/mobile
        run: |
          grep -q '"appId": "com.interplanetaryfund.app"' capacitor.config.json
          ! grep -q 'com.base6a67a778342a8fe05ee79cba.app' capacitor.config.json
      - name: Compile simulator app without distribution signing
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO build
          test -d build/Build/Products/Debug-iphonesimulator/App.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Debug-iphonesimulator/App.app ../../IFund-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: IFund-iOS-Simulator-Only
          path: |
            apps/mobile/IFund-iOS-Simulator.zip
            apps/mobile/package-lock.json
          if-no-files-found: error
          retention-days: 14

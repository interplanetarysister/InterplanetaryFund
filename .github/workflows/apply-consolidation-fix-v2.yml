name: Apply Consolidation Fix v2

on:
  push:
    branches:
      - agent1/fund-consolidation-integrity-guard

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch consolidation implementation
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');

            async function getFile(path) {
              const r = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (Array.isArray(r.data)) throw new Error(`Expected file: ${path}`);
              return { sha: r.data.sha, text: Buffer.from(r.data.content, 'base64').toString('utf8') };
            }
            async function putFile(path, text, sha, message) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch, message,
                content: Buffer.from(text, 'utf8').toString('base64'), sha
              });
            }

            const code = await getFile('convex/fundConsolidation.ts');
            let s = code.text;

            s = s.replace(
              /function lockStartedAt\([\s\S]*?\n}\n\n(?=async function getCampaign)/,
              ''
            );
            s = s.replace(
              /async function getActiveClaim\(ctx: any, campaignId: string\) \{[\s\S]*?\n}\n\n(?=async function findExistingProviderTransaction)/,
              `async function getActiveClaim(ctx: any, campaign: any) {
  const marker = campaign.lastConsolidationAt;
  if (!marker?.startsWith(CONSOLIDATION_LOCK_PREFIX)) return null;
  const started = Number(marker.slice(CONSOLIDATION_LOCK_PREFIX.length).split(":")[0]);
  if (!Number.isFinite(started) || Date.now() - started >= CONSOLIDATION_LOCK_TTL_MS) return null;
  const runs = await ctx.db
    .query("consolidationRuns")
    .withIndex("byCampaignId", (q: any) => q.eq("campaignId", campaign._id))
    .collect();
  return runs
    .filter((run: any) =>
      (run.status === "claimed" || run.status === "running") &&
      run.claimToken === marker,
    )
    .sort((a: any, b: any) => b.startedAt.localeCompare(a.startedAt))[0] ?? null;
}

`
            );

            s = s.replace(
              /const now = Date\.now\(\);\n  const activeClaim = await getActiveClaim\(ctx, campaign\._id\);\n  if \(activeClaim\) \{[\s\S]*?const startedAt = new Date\(now\)\.toISOString\(\);\n  const runId = await ctx\.db\.insert\("consolidationRuns", \{\n    campaignId: campaign\._id,\n    userId,\n    initiatedBy,\n    status: "claimed",/,
              `const now = Date.now();
  const activeClaim = await getActiveClaim(ctx, campaign);
  if (activeClaim) {
    return { status: "in_progress", runId: activeClaim._id };
  }

  const startedAt = new Date(now).toISOString();
  const claimToken = `${CONSOLIDATION_LOCK_PREFIX}${now}:${campaign._id}`;
  await ctx.db.patch(campaign._id, { lastConsolidationAt: claimToken });

  const runId = await ctx.db.insert("consolidationRuns", {
    campaignId: campaign._id,
    userId,
    initiatedBy,
    claimToken,
    status: "claimed",`
            );

            s = s.replace(
              /\n  \/\/ The campaign marker is intentionally committed with the claim mutation\.[\s\S]*?await ctx\.scheduler\.runAfter\(0, internal\.fundConsolidation\.processConsolidationRun, \{ runId \}\);/,
              `\n  await ctx.scheduler.runAfter(0, internal.fundConsolidation.processConsolidationRun, { runId });`
            );

            s = s.replace(
              /const campaign = await ctx\.db\.get\(run\.campaignId\);\n  if \(!campaign\) return \{ status: "failed", message: "Campaign not found" \};\n\n  const startedAt = run\.startedAt;/,
              `const campaign = await ctx.db.get(run.campaignId);
  if (!campaign) return { status: "failed", message: "Campaign not found" };
  if (!run.claimToken || campaign.lastConsolidationAt !== run.claimToken) {
    return { status: "ignored", reason: "stale_claim" };
  }

  const startedAt = run.startedAt;`
            );

            if (!s.includes('claimToken = `${CONSOLIDATION_LOCK_PREFIX}${now}:${campaign._id}`')) throw new Error('claim token patch did not apply');
            if (!s.includes('campaign.lastConsolidationAt !== run.claimToken')) throw new Error('stale claim guard did not apply');
            await putFile('convex/fundConsolidation.ts', s, code.sha, 'fix: establish durable consolidation claim boundary');

            const schema = await getFile('convex/schema.ts');
            let ss = schema.text;
            if (!ss.includes('claimToken: v.optional(v.string())')) {
              ss = ss.replace(
                /consolidationRuns: defineTable\(\{\n    campaignId: v\.string\(\),\n    userId: v\.string\(\),\n    initiatedBy: v\.string\(\),              \/\/ "user" \| "ai_agent" \| "system"\n    status: v\.string\(\),/,
                `consolidationRuns: defineTable({
    campaignId: v.string(),
    userId: v.string(),
    initiatedBy: v.string(),              // "user" | "ai_agent" | "system"
    claimToken: v.optional(v.string()),
    status: v.string(),`
              );
              ss = ss.replace(
                /\.index\("byStatus", \["status"\]\),\n\n  \/\/ PROVIDER TRANSACTIONS/,
                `.index("byStatus", ["status"]).index("byClaimToken", ["claimToken"]),

  // PROVIDER TRANSACTIONS`
              );
              if (!ss.includes('index("byClaimToken", ["claimToken"])')) throw new Error('schema patch did not apply');
              await putFile('convex/schema.ts', ss, schema.sha, 'fix: persist consolidation claim token');
            }

            const workflow = await getFile('.github/workflows/fund-consolidation-integrity.yml');
            let ws = workflow.text;
            if (!ws.includes('pull_request.head.sha || github.sha')) {
              ws = ws.replace(
                /- uses: actions\/checkout@v4\n/,
                `- uses: actions/checkout@v4\n        with:\n          ref: ${{ github.event.pull_request.head.sha || github.sha }}\n`
              );
              await putFile('.github/workflows/fund-consolidation-integrity.yml', ws, workflow.sha, 'ci: verify exact pull request head');
            }

            const test = `import fs from "node:fs";\nconst source = fs.readFileSync("convex/fundConsolidation.ts", "utf8");\nconst checks = [\n  [/const claimToken = /, "claim token created"],\n  [/lastConsolidationAt: claimToken/, "campaign marker written"],\n  [/claimToken,\\n    status: "claimed"/, "run stores claim token"],\n  [/campaign\\.lastConsolidationAt !== run\\.claimToken/, "stale claim rejected"],\n];\nconst failures = checks.filter(([rx]) => !rx.test(source));\nif (failures.length) { for (const [, label] of failures) console.error("FAIL: " + label); process.exit(1); }\nconsole.log("Consolidation claim-boundary checks passed.");\n`;
            const testFile = await getFile('scripts/test-consolidation-claim-boundary.mjs').catch(() => null);
            if (!testFile) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path: 'scripts/test-consolidation-claim-boundary.mjs', branch,
                message: 'test: add consolidation claim boundary check',
                content: Buffer.from(test, 'utf8').toString('base64')
              });
            }

            const current = await getFile('.github/workflows/apply-consolidation-fix-v2.yml');
            await github.rest.repos.deleteFile({ owner, repo, path: '.github/workflows/apply-consolidation-fix-v2.yml', sha: current.sha, branch, message: 'chore: remove consolidation patch workflow' });

name: Exact Head Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: exact-head-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify admin authentication and integration boundary
        run: |
          if [ -f scripts/verify-complete-admin-auth-surface.mjs ]; then
            node scripts/verify-complete-admin-auth-surface.mjs
          fi

      # Prevent regression of the canonical outreach safety architecture:
      # independent controls, opt-out preservation, subscription authority,
      # Browserbase fail-closed publishing, anti-spam reservations, and admin auth.
      - name: Verify outreach architecture invariants
        run: node scripts/verify-outreach-invariants.mjs

      # Convex bundles server modules differently from Vite/tsc. Run codegen here
      # so unsupported Node dependencies cannot pass PR checks and then fail only
      # during the production Convex deploy.
      - name: Verify Convex bundling and generated API
        run: npx convex codegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build web application
        run: npm run build

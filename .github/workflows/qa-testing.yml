# Interplanetary Fund — read-only live frontend QA.
# PAUSED: manual workflow_dispatch only. No schedules, push or PR triggers.
# Never register users, send donations, login, post content, or alter live data.
name: QA Testing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-frontend-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIVE_SITE_URL: https://interplanetaryfund.com/
      LIVE_BASE44_URL: https://interplanetaryfund.base44.app/
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser test dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Verify published frontend in HTTP and browser
        shell: bash
        run: |
          set +e
          node scripts/live-frontend-audit.mjs
          HTTP_RESULT=$?
          npx playwright test tests/e2e/live-frontend-readonly.spec.ts
          BROWSER_RESULT=$?
          if [ "$HTTP_RESULT" -ne 0 ] || [ "$BROWSER_RESULT" -ne 0 ]; then
            exit 1
          fi
      - name: Upload live frontend QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-frontend-qa
          path: |
            live-frontend-audit.json
            qa-report.json
            test-results/
          if-no-files-found: ignore
          retention-days: 7

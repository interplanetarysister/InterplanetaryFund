name: Apply Complete Admin Auth Surface

on:
  push:
    branches:
      - solstice/complete-admin-auth-surface

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply complete admin auth surface repair
        run: node scripts/apply-complete-admin-auth-surface.mjs

      - name: Verify complete admin auth surface
        run: node scripts/verify-complete-admin-auth-surface.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Commit validated runtime repair
        run: |
          git config user.name "IF Repair Bot"
          git config user.email "actions@github.com"
          git add convex/auth.ts convex/security.ts convex/adminUsers.ts convex/inbox.ts convex/agentAutomationAuthorization.ts convex/secureWithdraw.ts convex/fundMigration.ts scripts/verify-complete-admin-auth-surface.mjs
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "fix(security): complete admin credential and integration session boundary"
            git push origin HEAD:solstice/complete-admin-auth-surface
          fi

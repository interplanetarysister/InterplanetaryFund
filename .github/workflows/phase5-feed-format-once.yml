name: One-time Phase 5 feed formatting
on:
  push:
    branches:
      - migration/phase5-original-shell-recovery-20261026
    paths:
      - .github/workflows/phase5-feed-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'interplanetarysister/InterplanetaryFund'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/phase5-original-shell-recovery-20261026
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install prettier --write src/pages/Feed.jsx src/pages/Discover.jsx
      - name: Commit formatting and remove this temporary workflow
        run: |
          git config user.name "ifund-format-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/phase5-feed-format-once.yml
          git add src/pages/Feed.jsx src/pages/Discover.jsx
          git add -u .github/workflows/phase5-feed-format-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "style(phase5): format error-recovery pages"
          git push origin HEAD:migration/phase5-original-shell-recovery-20261026

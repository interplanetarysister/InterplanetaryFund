name: Build IFund Android app

# Owner-controlled build freeze: manual invocation only; no push/PR-triggered run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install web and native dependencies
        working-directory: apps/web
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Build shared web frontend
        working-directory: apps/web
        env:
          VITE_SUPABASE_URL: https://ssibsfmtodgximseeqsv.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_x9AX2hyHLr_kb2mewuH69Q_T66poFyL
        run: npm run build
      - name: Generate Android project
        working-directory: apps/web
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#050816' --splashBackgroundColor '#050816'
          npx cap sync android
      - name: Build debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IFund-Android-APK
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

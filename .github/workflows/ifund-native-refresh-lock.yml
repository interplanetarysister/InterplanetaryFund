name: IFund Independent Mobile Dependency Lock Verification

# Read-only, manually invoked exact-head lockfile integrity check.
# Never pushes to the deprecated route-completion branch or alters Base44.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ifund-native-dependency-lock-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify independent app identity before installing
        run: |
          node apps/mobile/scripts/verify-mobile.mjs --candidate
          node -e "const a=require('./apps/mobile/capacitor.config.json');if(a.appId!=='com.interplanetaryfund.app')process.exit(1)"
      - name: Verify exact committed dependency lock without writing changes
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          node -e "const fs=require('fs'),p=require('./package.json'),l=require('./package-lock.json');if(l.name!==p.name||l.lockfileVersion<3||Object.keys(p.dependencies).some(k=>l.packages[''].dependencies[k]!==p.dependencies[k])||Object.keys(p.devDependencies).some(k=>l.packages[''].devDependencies[k]!==p.devDependencies[k]))process.exit(1)"
          git diff --exit-code -- apps/mobile/package.json apps/mobile/package-lock.json
      - name: Preserve validated lock for review
        uses: actions/upload-artifact@v4
        with:
          name: IFund-independent-mobile-package-lock-read-only
          path: apps/mobile/package-lock.json
          if-no-files-found: error
          retention-days: 7

name: One-time expanded frontend validation (recheck)
on:
  push:
    branches:
      - migration/phase5-all-page-routes-20261026
    paths:
      - .github/workflows/phase5-frontend-format-once.yml
permissions:
  contents: write
jobs:
  format-and-verify:
    if: github.repository == 'interplanetarysister/InterplanetaryFund'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/phase5-all-page-routes-20261026
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format React and CSS to stable revision
        run: |
          npx --no-install prettier --write "src/**/*.{js,jsx,css}"
          npx --no-install prettier --write "src/**/*.{js,jsx,css}"
          npx --no-install prettier --write "src/**/*.{js,jsx,css}"
      - name: Unit tests
        run: npm test
      - name: Vite build
        run: npm run build
      - name: Format and diff check
        run: |
          npx --no-install prettier --check "src/**/*.{js,jsx,css}"
          git diff --check
      - name: Remove temporary workflow and save formatted code
        run: |
          git config user.name "ifund-format-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/phase5-frontend-format-once.yml
          git add src
          git add -u .github/workflows/phase5-frontend-format-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "style(frontend): validate and format original IFund experience"
          git push origin HEAD:migration/phase5-all-page-routes-20261026

name: Reporter blog migration checks
# Owner-controlled build freeze: manual invocation only; no push/PR-triggered run.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run test suite
        run: npm test
      - name: Build production bundle
        run: npm run build

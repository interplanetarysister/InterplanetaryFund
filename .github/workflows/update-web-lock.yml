name: Verify IFund web dependency lock

# Manual, read-only exact-head validation. Lockfile changes must be reviewed as
# ordinary source commits, never silently pushed by a mutable CI workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify exact committed web dependencies
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps --no-audit --no-fund
          node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(l.lockfileVersion<3 || Object.keys(p.dependencies).some(k=>l.packages[''].dependencies[k]!==p.dependencies[k]) || Object.keys(p.devDependencies).some(k=>l.packages[''].devDependencies[k]!==p.devDependencies[k])) process.exit(1)"
          git -C ../.. diff --exit-code -- apps/web/package.json apps/web/package-lock.json
      - name: Preserve reviewed lockfile artifact
        uses: actions/upload-artifact@v4
        with:
          name: IFund-web-lockfile-read-only
          path: apps/web/package-lock.json
          retention-days: 7
          if-no-files-found: error

name: Admin Credential Surface

on:
  pull_request:
    paths:
      - "convex/auth.ts"
      - "convex/adminUsers.ts"
      - "scripts/verify-admin-credential-surface.mjs"
      - ".github/workflows/admin-credential-surface.yml"
  push:
    branches: [main]
    paths:
      - "convex/auth.ts"
      - "convex/adminUsers.ts"
      - "scripts/verify-admin-credential-surface.mjs"
      - ".github/workflows/admin-credential-surface.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify admin credential surface
        run: node scripts/verify-admin-credential-surface.mjs

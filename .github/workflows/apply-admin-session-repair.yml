name: Apply Admin Session Repair

on:
  push:
    branches:
      - agent1/admin-session-integration-auth-repair

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply coordinated repair
        run: node scripts/apply-admin-session-integration-repair.mjs

      - name: Verify admin session and integration boundary
        run: node scripts/verify-admin-session-integration-boundary.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build production application
        run: npm run build

      - name: Commit validated repair
        run: |
          git config user.name "IF Repair Bot"
          git config user.email "actions@github.com"
          git add convex/schema.ts convex/adminUsers.ts convex/agents.ts convex/agentAutomation.ts convex/campaigns.ts src/App.tsx src/pages/Admin.tsx src/components/PermissionsManager.tsx src/pages/Agents.tsx scripts/verify-admin-session-integration-boundary.mjs
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "fix(security): unify admin sessions and integration authorization"
            git push origin HEAD:agent1/admin-session-integration-auth-repair
          fi

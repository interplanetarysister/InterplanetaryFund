name: Build Android APK

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-apk.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned Capacitor CLI
        run: npx cap --version

      - name: Build web app
        run: npm run build
        env:
          VITE_CONVEX_URL: https://rosy-butterfly-2.convex.cloud

      - name: Create release-safe Capacitor config
        run: |
          cat > capacitor.config.json << 'CONF'
          {
            "appId": "com.interplanetaryfund.app",
            "appName": "Interplanetary Fund",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": false
            }
          }
          CONF
          rm -f capacitor.config.ts

      - name: Add Android platform
        run: npx cap add android

      - name: Copy web assets
        run: npx cap copy

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -x lint 2>&1
          find . -name "*.apk" -type f

      - name: Find and rename APK
        run: |
          APK_PATH=$(find android -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK was built"
            exit 1
          fi
          cp "$APK_PATH" "interplanetary-fund.apk"
          test -s interplanetary-fund.apk
          ls -la interplanetary-fund.apk
          echo "APK found at: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: interplanetary-fund-apk-${{ github.sha }}
          path: interplanetary-fund.apk
          if-no-files-found: error
          retention-days: 14

  publish-apk-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated APK artifact
        uses: actions/download-artifact@v7
        with:
          name: interplanetary-fund-apk-${{ github.sha }}

      - name: Verify downloaded APK
        run: test -s interplanetary-fund.apk

      - name: Publish immutable APK release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-${{ github.run_number }}-${{ github.sha }}
          name: "Interplanetary Fund APK #${{ github.run_number }}"
          body: |
            APK built from main at ${{ github.sha }} after the same workflow's exact-source validation.

            This is the installable Android test build. Store publication signing remains separate and must use protected release credentials.
          files: interplanetary-fund.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
      - 'twa-manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize TWA project
        run: |
          echo "n" | bubblewrap init --manifest https://interplanetary-fund.vercel.app/manifest.json --directory ./twa-project || true

      - name: Generate signing key
        run: |
          keytool -genkey -v -keystore android.keystore -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass interplanetary -keypass interplanetary \
            -dname "CN=Interplanetary Fund, O=Interplanetary Fund, L=Earth, ST=Earth, C=US"

      - name: Build APK
        working-directory: ./twa-project
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          echo "n" | bubblewrap build --skipPwaValidation 2>&1 || true
          # Also try gradle directly if bubblewrap fails
          if ! find . -name "*.apk" -type f | head -1 | grep -q .; then
            echo "Bubblewrap build failed, trying gradle directly..."
            chmod +x ./gradlew 2>/dev/null || true
            ./gradlew assembleRelease --no-daemon -x lint 2>&1 || true
          fi

      - name: Find and copy APK
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "interplanetary-fund.apk"
            echo "Found APK: $APK_PATH"
            ls -la interplanetary-fund.apk
          else
            echo "No APK was built"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: interplanetary-fund-apk
          path: interplanetary-fund.apk
          if-no-files-found: ignore

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        if: hashFiles('interplanetary-fund.apk') != ''
        with:
          tag_name: latest-apk
          name: "Interplanetary Fund APK (Latest)"
          body: |
            Auto-built APK from latest main branch.
            
            Download and install on your Android device.
            You may need to enable "Install from unknown sources" in your settings.
          files: interplanetary-fund.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Live IFund Android download status (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live website and APK availability information
        run: |
          curl -fsSL --max-time 20 https://interplanetaryfund.com/ -o /tmp/ifund.html
          grep -Eiq '<html|<!doctype' /tmp/ifund.html
          echo "Real APK builds occur exclusively in interplanetary-fund2 on explicit request."

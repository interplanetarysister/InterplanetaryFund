name: Temporary IFund Studio formatter
on:
  push:
    branches:
      - feature/ifund-studio-foundation-20261103
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[format-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install prettier --write src/App.jsx src/pages/AdminStudio.jsx src/styles.css
      - name: Commit formatting on this feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/pages/AdminStudio.jsx src/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "style(studio): format builder files [format-bot]"
            git push origin HEAD:feature/ifund-studio-foundation-20261103
          fi

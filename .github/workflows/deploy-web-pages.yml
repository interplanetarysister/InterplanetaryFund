name: Deploy branded frontend to Cloudflare Pages

# Publishes the apps/web bundle. This does NOT touch DNS: the custom domain is
# attached in the Cloudflare dashboard, not here, and the cutover gate in
# apps/web/DEPLOYMENT-GATES.md still applies before interplanetaryfund.com is
# pointed at this bundle.
#
# THE SINGLE OWNER-TRIGGERED RELEASE PIPELINE. Automatic Pages preview and
# production builds are deliberately disabled. Code/QA changes stack on main
# until an explicit manual dispatch. Compile once; preview is always first.
# Preview is the only output of this workflow. Production needs an independent,
# separately authorized promotion process after actual preview acceptance.
# Preserve the compiled dist artifact so a future verified release can reuse it.
# Never re-enable Git push auto-deploy or trigger per-agent Pages releases.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   - scoped to "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID
# Required repository variables (publishable/browser-safe values only):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
# Optional repository variable:
#   VITE_SUPABASE_OAUTH_PROVIDERS - comma-separated subset of "google,facebook".
#     Only names a provider whose OAuth client is enabled in the Supabase
#     dashboard. Empty or unset simply renders no social buttons.
# Never add a service-role key here; it would be baked into the public bundle.

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  # A single release lane: newer explicitly authorized dispatch supersedes older.
  group: ifund-single-pages-release
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pin the one approved release to canonical main
        env:
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REF_NAME" = "refs/heads/main" || { echo "::error::Dispatch the canonical main branch only"; exit 1; }
          echo "Approved release revision: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Block release until every navigation route is implemented
        run: node apps/web/ci/verify-route-readiness.mjs

      - name: Refuse to deploy without a backend URL
        if: ${{ vars.VITE_SUPABASE_URL == '' }}
        run: |
          echo "::error::Repository variable VITE_SUPABASE_URL is not set. Refusing to publish a build with no backend."
          exit 1

      - name: Build and test
        working-directory: apps/web
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_OAUTH_PROVIDERS: ${{ vars.VITE_SUPABASE_OAUTH_PROVIDERS }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test 2>&1 | tee /tmp/ifund-release-tests.log
          npm run build
          test -f dist/_redirects || { echo "::error::dist/_redirects missing; deep links would 404"; exit 1; }
          test -f dist/_headers || { echo "::error::dist/_headers missing"; exit 1; }

      - name: Seal the tested release artifact
        working-directory: apps/web
        run: |
          set -euo pipefail
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/ifund-dist-files.sha256
          test -s /tmp/ifund-dist-files.sha256
          echo "One immutable compiled artifact created from $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "revision=$(git rev-parse HEAD)"
            echo "environment=preview-before-production"
            echo "tests=apps/web npm test"
            echo "build=apps/web npm run build"
            echo "artifact_sha256=$(sha256sum /tmp/ifund-dist-files.sha256 | cut -d' ' -f1)"
          } > /tmp/ifund-release-evidence.txt

      - name: Archive test output and artifact manifest (no extra build)
        uses: actions/upload-artifact@v4
        with:
          name: ifund-single-build-evidence
          path: |
            /tmp/ifund-release-tests.log
            /tmp/ifund-dist-files.sha256
            /tmp/ifund-release-evidence.txt
            apps/web/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish the single compiled artifact to preview
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: >-
            pages deploy dist
            --project-name=interplanetaryfund-migration
            --branch=preview

      - name: Smoke-test the preview before production promotion
        env:
          DEPLOYMENT_URL: ${{ steps.preview.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL" || { echo "::error::Preview deployment URL not returned"; exit 1; }
          case "$DEPLOYMENT_URL" in https://*.pages.dev|https://*.pages.dev/) ;; *) echo "::error::Unexpected preview URL"; exit 1;; esac
          curl --fail --silent --show-error --retry 4 --retry-delay 3 --retry-connrefused "$DEPLOYMENT_URL" -o /dev/null


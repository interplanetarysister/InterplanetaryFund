# Interplanetary Fund — Production Convex Deployment
#
# Production deployment is intentionally isolated from the observability agent.
# Only backend-relevant changes trigger this workflow. A single concurrency gate
# prevents parallel production Convex deployments.

name: Convex Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'convex/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: convex-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Convex production
        run: npx convex deploy

      - name: Provision serialized automation singleton
        run: npx convex run automationProvisioning:provisionAutomationLaneLock '{}'

      - name: Verify serialized automation singleton
        shell: bash
        run: |
          set -euo pipefail
          npx convex run automationProvisioning:getAutomationLaneLockStatus '{}' > /tmp/automation-lock-status.txt
          cat /tmp/automation-lock-status.txt
          grep -q '"initialized": true' /tmp/automation-lock-status.txt
          grep -q '"recordCount": 1' /tmp/automation-lock-status.txt

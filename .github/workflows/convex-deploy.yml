# Archived legacy repository: workflows only run when an owner explicitly dispatches.
# No scheduled checks, no builds, no external publishing and no deployments.
# All real app code, actions, and user authorization belong to interplanetary-fund2.
name: "IFund Live — Backend health review"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-service-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify live IFund (read-only)
        shell: bash
        run: |
          set -euo pipefail
          echo "This is an on-demand IFund production diagnostic. Source and user actions are owned by interplanetary-fund2."
          curl --fail --silent --show-error --location --max-time 20 https://interplanetaryfund.com/ -o /tmp/ifund-home.html
          grep -Eiq '<html|<!doctype' /tmp/ifund-home.html
          curl --fail --silent --show-error --location --max-time 20 https://interplanetaryfund.com/api/health -o /tmp/ifund-health.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/ifund-health.json','utf8'))"
          echo "Completed read-only IFund live-service checks. No user content, payment or deployment was changed."

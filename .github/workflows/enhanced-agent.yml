# Interplanetary Fund — Enhanced Autonomous Agent
# Runs every 30 minutes on GitHub Actions (free for public repos)
# 
# Handles: build, deploy, protocol, treasury, campaign sync, donation
# monitoring, site health, GitHub Actions status, auto-commit
# 
# Zero Base44 credits consumed — all work in GitHub Actions runners.
#
# Copyright © 2026 Michelle Rogers. All Rights Reserved.

name: Enhanced Autonomous Agent

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Convex types
        run: npx convex codegen || true

      - name: Run enhanced agent cycle
        run: node scripts/enhanced-agent.mjs
        continue-on-error: true

      - name: Commit and push if changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "IF Autonomous Agent"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "chore: autonomous agent sync ($(date -u +%Y-%m-%d_%H:%M))"
            git push
          fi

      - name: Upload agent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-report-${{ github.run_id }}
          path: agent-report.json
          retention-days: 7

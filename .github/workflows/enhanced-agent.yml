# Interplanetary Fund — live frontend audit.
# PAUSED: only the owner can run this manually through workflow_dispatch.
# No schedules, push hooks, deployments, backend writes, or financial actions.
name: Enhanced Autonomous Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-frontend-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit published IFund website and Base44 frontend (read-only)
        env:
          LIVE_SITE_URL: https://interplanetaryfund.com/
          LIVE_BASE44_URL: https://interplanetaryfund.base44.app/
        run: node scripts/live-frontend-audit.mjs
      - name: Save site audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-frontend-audit
          path: live-frontend-audit.json
          if-no-files-found: ignore
          retention-days: 7

# Interplanetary Fund — Enhanced Autonomous Agent
# Runs every 30 minutes on GitHub Actions.
#
# This workflow is OBSERVABILITY ONLY. It must never deploy Convex or push
# commits to main. Production Convex deployment is isolated in
# convex-deploy.yml with its own concurrency gate.
#
# Copyright © 2026 Michelle Rogers. All Rights Reserved.

name: Enhanced Autonomous Agent

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Never allow two monitoring cycles to execute at the same time.
concurrency:
  group: if-enhanced-agent
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run enhanced monitoring cycle
        run: node scripts/enhanced-agent.mjs
        continue-on-error: true

      - name: Upload agent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-report-${{ github.run_id }}
          path: agent-report.json
          if-no-files-found: ignore
          retention-days: 7

name: Fund Consolidation Integrity

on:
  pull_request:
    paths:
      - "convex/fundConsolidation.ts"
      - "scripts/verify-fund-consolidation-integrity.mjs"
      - ".github/workflows/fund-consolidation-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "convex/fundConsolidation.ts"
      - "scripts/verify-fund-consolidation-integrity.mjs"
      - ".github/workflows/fund-consolidation-integrity.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify consolidation integrity boundary
        run: node scripts/verify-fund-consolidation-integrity.mjs

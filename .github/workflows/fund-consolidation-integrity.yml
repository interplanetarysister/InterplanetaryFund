name: Fund Consolidation Integrity

on:
  pull_request:
    paths:
      - "convex/fundConsolidation.ts"
      - "convex/fundConsolidation.concurrency.test.ts"
      - "scripts/verify-fund-consolidation-integrity.mjs"
      - ".github/workflows/fund-consolidation-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "convex/fundConsolidation.ts"
      - "convex/fundConsolidation.concurrency.test.ts"
      - "scripts/verify-fund-consolidation-integrity.mjs"
      - ".github/workflows/fund-consolidation-integrity.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify consolidation integrity boundary
        run: node scripts/verify-fund-consolidation-integrity.mjs
      - name: Install isolated Convex test dependencies
        run: npm install --no-save --package-lock=false convex-test vitest @edge-runtime/vm
      - name: Run consolidation concurrency test
        run: npx vitest run convex/fundConsolidation.concurrency.test.ts

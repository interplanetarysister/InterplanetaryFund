name: Apply PR 99 Transactional Fencing Repair

on:
  push:
    branches:
      - agent1/p0-convex-durable-claim-current-main-r13
    paths:
      - '.github/workflows/apply-pr99-fencing.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent1/p0-convex-durable-claim-current-main-r13
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply fenced scheduled-writer transformation
        run: |
          node <<'NODE'
          const fs = require('fs');

          function edit(path, transform) {
            const before = fs.readFileSync(path, 'utf8');
            const after = transform(before);
            if (after === before) throw new Error(`No change made to ${path}`);
            fs.writeFileSync(path, after);
          }

          function addImport(s, path) {
            if (s.includes('assertAutomationLaneOwnership')) return s;
            const marker = 'import { v } from "convex/values";';
            if (!s.includes(marker)) throw new Error(`Missing import marker in ${path}`);
            return s.replace(marker, marker + '\nimport { assertAutomationLaneOwnership } from "./automationLease";');
          }

          function fenceFunction(s, exportName) {
            const head = `export const ${exportName} = internalMutation({`;
            const start = s.indexOf(head);
            if (start < 0) throw new Error(`Missing ${exportName}`);
            const argsStart = s.indexOf('args:', start);
            const handlerStart = s.indexOf('handler:', argsStart);
            if (argsStart < 0 || handlerStart < 0) throw new Error(`Malformed ${exportName}`);
            const argsText = s.slice(argsStart, handlerStart);
            if (/claimToken\s*:\s*v\.string\(\)/.test(argsText)) return s;
            const emptyArgs = s.slice(argsStart, handlerStart).match(/^args:\s*\{\s*\},\s*\n\s*/);
            if (!emptyArgs) throw new Error(`${exportName} args are not empty; transform explicitly`);
            s = s.slice(0, argsStart) + argsText.replace(/args:\s*\{\s*\},/, 'args: { claimToken: v.string() },') + s.slice(handlerStart);
            const newHandlerStart = s.indexOf('handler:', start);
            const arrow = s.indexOf('=> {', newHandlerStart);
            if (arrow < 0) throw new Error(`Missing handler arrow for ${exportName}`);
            const handlerSig = s.slice(newHandlerStart, arrow + 4);
            let replacement = handlerSig;
            if (/async \(ctx\)/.test(handlerSig)) replacement = handlerSig.replace('async (ctx)', 'async (ctx, { claimToken })');
            else throw new Error(`Unexpected handler signature for ${exportName}: ${handlerSig}`);
            replacement += '\n    await assertAutomationLaneOwnership(ctx, claimToken);';
            return s.slice(0, newHandlerStart) + replacement + s.slice(arrow + 4);
          }

          const targets = {
            'convex/autonomous.ts': ['checkSiteHealth','autoRepair'],
            'convex/postContent.ts': ['autoGeneratePosts'],
            'convex/facebook.ts': ['discoverGroupsProactively','improveOutreachStrategy'],
            'convex/protocolAutoFix.ts': ['runFullAutoFix'],
            'convex/protocol.ts': ['weeklyTraining'],
            'convex/imageGen.ts': ['generateCampaignCoverUrls'],
            'convex/fundConsolidation.ts': ['runAutoConsolidation'],
            'convex/agentAutomation.ts': ['runAtlasAutomation','runPostProductionAutomation','runDonorRelationsAutomation','runScoutAutomation','runCoordinatorAutomation'],
          };

          for (const [path, names] of Object.entries(targets)) {
            edit(path, (input) => {
              let s = addImport(input, path);
              for (const name of names) s = fenceFunction(s, name);
              if (path === 'convex/protocolAutoFix.ts') {
                s = s.replace('const platformFee = gross * 0.05;', 'const platformFee = gross * 0.03;');
                if (s.includes('const platformFee = gross * 0.05;')) throw new Error('protocolAutoFix 5% fallback remains');
              }
              if (path === 'convex/fundConsolidation.ts') {
                s = s.replaceAll('feeConfig?.platformFeePercent ?? 5', 'feeConfig?.platformFeePercent ?? 3');
                if (s.includes('feeConfig?.platformFeePercent ?? 5')) throw new Error('fundConsolidation 5% fallback remains');
              }
              return s;
            });
          }

          // Research delegates to Browserbase; both layers must carry and verify the same claim.
          edit('convex/research.ts', (input) => {
            let s = addImport(input, 'convex/research.ts');
            const old = `export const runAgentResearch = internalMutation({\n  args: {},\n  handler: async (ctx): Promise<any> => {\n    // Delegate to the browserbase module\n    const result = await ctx.runMutation(internal.browserbase.runAllAgentBrowserResearch, {});`;
            const next = `export const runAgentResearch = internalMutation({\n  args: { claimToken: v.string() },\n  handler: async (ctx, { claimToken }): Promise<any> => {\n    await assertAutomationLaneOwnership(ctx, claimToken);\n    // Delegate to the browserbase module using the same fenced claim.\n    const result = await ctx.runMutation(internal.browserbase.runAllAgentBrowserResearch, { claimToken });`;
            if (!s.includes(old)) throw new Error('runAgentResearch anchor missing');
            return s.replace(old, next);
          });

          edit('convex/browserbase.ts', (input) => {
            let s = addImport(input, 'convex/browserbase.ts');
            let old = `export const runAgentBrowserResearch = internalMutation({\n  args: { agentRole: v.string() },\n  handler: async (ctx, { agentRole }) => {`;
            let next = `export const runAgentBrowserResearch = internalMutation({\n  args: { agentRole: v.string(), claimToken: v.string() },\n  handler: async (ctx, { agentRole, claimToken }) => {\n    await assertAutomationLaneOwnership(ctx, claimToken);`;
            if (!s.includes(old)) throw new Error('runAgentBrowserResearch anchor missing');
            s = s.replace(old, next);
            old = `export const runAllAgentBrowserResearch = internalMutation({\n  args: {},\n  handler: async (ctx): Promise<any> => {\n    const allResults = [];`;
            next = `export const runAllAgentBrowserResearch = internalMutation({\n  args: { claimToken: v.string() },\n  handler: async (ctx, { claimToken }): Promise<any> => {\n    await assertAutomationLaneOwnership(ctx, claimToken);\n    const allResults = [];`;
            if (!s.includes(old)) throw new Error('runAllAgentBrowserResearch anchor missing');
            s = s.replace(old, next);
            old = 'internal.browserbase.runAgentBrowserResearch, { agentRole: role }';
            next = 'internal.browserbase.runAgentBrowserResearch, { agentRole: role, claimToken }';
            if (!s.includes(old)) throw new Error('nested Browserbase caller anchor missing');
            return s.replace(old, next);
          });
          NODE
      - name: Update focused automation verifiers and exact-head CI
        run: |
          cat > scripts/verify-automation-serialization.mjs <<'NODE'
          import fs from "node:fs";

          const read = (p) => fs.readFileSync(new URL(`../${p}`, import.meta.url), "utf8");
          const crons = read("convex/crons.ts");
          const coordinator = read("convex/automationCoordinator.ts");
          const lease = read("convex/automationLease.ts");

          const forbiddenCronIds = [
            "daily-protocol-autofix","weekly-training-session","daily-post-generation",
            "proactive-group-discovery","outreach-strategy-improvement","site-health-monitor",
            "auto-repair","agent-research-sprint","browserbase-research","atlas-facebook-automation",
            "post-production-automation","donor-relations-automation","scout-automation",
            "coordinator-automation","master-agent-check","auto-cover-images","auto-fund-consolidation",
          ];
          for (const id of forbiddenCronIds) {
            if (crons.includes(`\"${id}\"`)) throw new Error(`Independent scheduled writer remains: ${id}`);
          }
          if (!crons.includes('"serialized-automation-lane"')) throw new Error("Serialized cron missing");
          if (!crons.includes('internal.automationCoordinator.runSerializedAutomation')) throw new Error("Serialized coordinator cron target missing");

          for (const required of [
            "assertAutomationLaneOwnership", "automation_lane_stale_owner",
            "automation_lock_not_initialized", "automation_lock_not_unique",
            "automation-lane-lease:${claimToken}", "expiresAt <= nowMs",
          ]) if (!lease.includes(required)) throw new Error(`Lease fence contract missing: ${required}`);

          for (const required of [
            "renewAutomationLane", "await renew()", "claimToken: runId",
            'utcDay === 6 && utcHour === 9', 'utcHour === 13', 'utcHour === 15',
            'isHourSlot(startedAt, 2)', 'isHourSlot(startedAt, 4)',
            'isHourSlot(startedAt, 6)', 'isHourSlot(startedAt, 12)',
            '"proactive-group-discovery"', '"coordinator-automation"',
            '"auto-fund-consolidation"', '"auto-cover-images"',
            '"master-agent-health-check"', '"covered_by_agent_research"',
          ]) if (!coordinator.includes(required)) throw new Error(`Coordinator contract missing: ${required}`);
          if (coordinator.includes('internal.agentAutomation.runAllAgentAutomation')) throw new Error("Mutating legacy master runner must not be used by coordinator");

          const fenced = {
            "convex/autonomous.ts": ["checkSiteHealth","autoRepair"],
            "convex/postContent.ts": ["autoGeneratePosts"],
            "convex/facebook.ts": ["discoverGroupsProactively","improveOutreachStrategy"],
            "convex/protocolAutoFix.ts": ["runFullAutoFix"],
            "convex/protocol.ts": ["weeklyTraining"],
            "convex/imageGen.ts": ["generateCampaignCoverUrls"],
            "convex/fundConsolidation.ts": ["runAutoConsolidation"],
            "convex/agentAutomation.ts": ["runAtlasAutomation","runPostProductionAutomation","runDonorRelationsAutomation","runScoutAutomation","runCoordinatorAutomation"],
            "convex/research.ts": ["runAgentResearch"],
            "convex/browserbase.ts": ["runAgentBrowserResearch","runAllAgentBrowserResearch"],
          };
          for (const [path, names] of Object.entries(fenced)) {
            const src = read(path);
            if (!src.includes('assertAutomationLaneOwnership')) throw new Error(`${path} missing lease helper`);
            for (const name of names) {
              const start = src.indexOf(`export const ${name} = internalMutation({`);
              if (start < 0) throw new Error(`${path}:${name} missing`);
              const tail = src.slice(start, start + 1400);
              if (!tail.includes('claimToken: v.string()')) throw new Error(`${path}:${name} missing claimToken arg`);
              if (!tail.includes('assertAutomationLaneOwnership(ctx, claimToken)')) throw new Error(`${path}:${name} missing transactional lease assertion`);
            }
          }

          const research = read("convex/research.ts");
          const browser = read("convex/browserbase.ts");
          if (!research.includes('runAllAgentBrowserResearch, { claimToken }')) throw new Error("Research does not propagate claimToken");
          if (!browser.includes('runAgentBrowserResearch, { agentRole: role, claimToken }')) throw new Error("Browserbase does not propagate claimToken");

          const protocolFix = read("convex/protocolAutoFix.ts");
          const consolidation = read("convex/fundConsolidation.ts");
          if (protocolFix.includes('gross * 0.05')) throw new Error("Protocol auto-fix still contains 5% platform fee fallback");
          if (consolidation.includes('platformFeePercent ?? 5')) throw new Error("Fund consolidation still contains 5% platform fee fallback");

          console.log("Automation serialization + transactional fencing verification: PASS");
          NODE

          cat > scripts/test-automation-fencing-model.mjs <<'NODE'
          import assert from "node:assert/strict";
          const lease = { owner: null, expiresAt: 0 };
          const claim = (token, now, ttl=100) => {
            if (lease.owner && lease.expiresAt > now) return false;
            lease.owner = token; lease.expiresAt = now + ttl; return true;
          };
          const verify = (token, now) => lease.owner === token && lease.expiresAt > now;
          const renew = (token, now, ttl=100) => { if (!verify(token, now)) return false; lease.expiresAt = now + ttl; return true; };
          const release = (token) => { if (lease.owner !== token) return false; lease.owner = null; lease.expiresAt = 0; return true; };

          assert.equal(claim("A", 0), true);
          assert.equal(claim("B", 50), false, "duplicate claimant must lose while A is live");
          assert.equal(verify("A", 50), true);
          assert.equal(renew("A", 50), true);
          assert.equal(claim("B", 120), false, "renewed A must retain the lane");
          assert.equal(claim("B", 151), true, "successor may claim only after renewed expiry");
          assert.equal(verify("A", 151), false, "stale A must be fenced after successor claim");
          assert.equal(verify("B", 151), true);
          assert.equal(release("A"), false, "stale A must not release B's lease");
          assert.equal(verify("B", 151), true);
          assert.equal(release("B"), true);
          console.log("Automation fencing transition model: PASS");
          NODE

          node <<'NODE'
          const fs = require('fs');
          const p = '.github/workflows/exact-head-validation.yml';
          let s = fs.readFileSync(p, 'utf8');
          const anchor = `      - name: Typecheck\n        run: npx tsc --noEmit\n`;
          if (!s.includes(anchor)) throw new Error('exact-head typecheck anchor missing');
          const insert = `      - name: Verify serialized automation provisioning and fencing\n        run: |\n          npm run verify:automation-provisioning\n          npm run verify:automation-serialization\n          node scripts/test-automation-fencing-model.mjs\n\n`;
          if (!s.includes('Verify serialized automation provisioning and fencing')) s = s.replace(anchor, insert + anchor);
          fs.writeFileSync(p, s);
          NODE
      - name: Run focused reliability checks
        run: |
          npm run verify:automation-provisioning
          npm run verify:automation-serialization
          node scripts/test-automation-fencing-model.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Commit validated repair
        run: |
          git config user.name "IF Repair Bot"
          git config user.email "actions@github.com"
          git add convex .github/workflows/exact-head-validation.yml scripts
          git commit -m "fix(convex): fence all scheduled automation writers"
          git push origin HEAD:agent1/p0-convex-durable-claim-current-main-r13

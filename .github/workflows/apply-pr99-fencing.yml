# Attempt 2: permanent verifier now matches the single-lane fenced topology.
name: Apply PR 99 Transactional Fencing

on:
  push:
    branches:
      - agent1/p0-convex-durable-claim-current-main-r13
    paths:
      - '.github/workflows/apply-pr99-fencing.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent1/p0-convex-durable-claim-current-main-r13
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply transactional claim fencing to every scheduled writer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = {}
          def read(path):
              if path not in files:
                  files[path] = Path(path).read_text()
              return files[path]
          def write_all():
              for path, text in files.items():
                  Path(path).write_text(text)
          def add_import(path):
              text = read(path)
              line = 'import { assertAutomationLaneOwnership } from "./automationLease";\n'
              if line in text:
                  return
              matches = list(re.finditer(r'^import .*?;\n', text, re.M))
              if not matches:
                  raise RuntimeError(f'No import block in {path}')
              pos = matches[-1].end()
              files[path] = text[:pos] + line + text[pos:]
          def fence(path, name, extra_arg=None, destructured=None):
              add_import(path)
              text = read(path)
              marker = f'export const {name} = internalMutation({{'
              start = text.find(marker)
              if start < 0:
                  raise RuntimeError(f'Missing {name} in {path}')
              end = text.find('\n});', start)
              if end < 0:
                  raise RuntimeError(f'Unable to bound {name} in {path}')
              end += len('\n});')
              block = text[start:end]
              if 'claimToken: v.string()' not in block:
                  if 'args: {},' in block:
                      block = block.replace('args: {},', 'args: { claimToken: v.string() },', 1)
                  elif extra_arg:
                      old, new = extra_arg
                      if old not in block:
                          raise RuntimeError(f'Args pattern missing for {name}')
                      block = block.replace(old, new, 1)
                  else:
                      raise RuntimeError(f'Unsupported args shape for {name}')
              if 'await assertAutomationLaneOwnership(ctx, claimToken);' not in block:
                  patterns = [
                      ('handler: async (ctx) => {', 'handler: async (ctx, { claimToken }) => {'),
                      ('handler: async (ctx): Promise<any> => {', 'handler: async (ctx, { claimToken }): Promise<any> => {'),
                  ]
                  if destructured:
                      patterns.insert(0, destructured)
                  changed = False
                  for old, new in patterns:
                      if old in block:
                          block = block.replace(old, new, 1)
                          block = block.replace(new, new + '\n    await assertAutomationLaneOwnership(ctx, claimToken);', 1)
                          changed = True
                          break
                  if not changed:
                      raise RuntimeError(f'Handler pattern missing for {name}')
              final_return = block.rfind('\n    return ')
              if final_return < 0:
                  raise RuntimeError(f'Final return missing for {name}')
              end_guard = '\n    await assertAutomationLaneOwnership(ctx, claimToken);'
              if end_guard not in block[max(0, final_return-120):final_return]:
                  block = block[:final_return] + end_guard + block[final_return:]
              files[path] = text[:start] + block + text[end:]

          fence('convex/autonomous.ts', 'checkSiteHealth')
          fence('convex/autonomous.ts', 'autoRepair')
          fence('convex/postContent.ts', 'autoGeneratePosts')
          fence('convex/facebook.ts', 'discoverGroupsProactively')
          fence('convex/facebook.ts', 'improveOutreachStrategy')
          fence('convex/protocolAutoFix.ts', 'runFullAutoFix')
          fence('convex/protocol.ts', 'weeklyTraining')
          fence('convex/imageGen.ts', 'generateCampaignCoverUrls')
          fence('convex/fundConsolidation.ts', 'runAutoConsolidation')

          for name in [
              'runAtlasAutomation', 'runPostProductionAutomation',
              'runDonorRelationsAutomation', 'runScoutAutomation',
              'runCoordinatorAutomation', 'runAllAgentAutomation',
          ]:
              fence('convex/agentAutomation.ts', name)

          fence(
              'convex/browserbase.ts', 'runAgentBrowserResearch',
              extra_arg=(
                  'args: { agentRole: v.string() },',
                  'args: { agentRole: v.string(), claimToken: v.string() },',
              ),
              destructured=(
                  'handler: async (ctx, { agentRole }) => {',
                  'handler: async (ctx, { agentRole, claimToken }) => {',
              ),
          )
          fence('convex/browserbase.ts', 'runAllAgentBrowserResearch')
          fence('convex/research.ts', 'runAgentResearch')

          p = 'convex/research.ts'
          s = read(p)
          old = 'internal.browserbase.runAllAgentBrowserResearch, {}'
          if old not in s and 'internal.browserbase.runAllAgentBrowserResearch, { claimToken }' not in s:
              raise RuntimeError('research Browserbase delegation pattern missing')
          files[p] = s.replace(old, 'internal.browserbase.runAllAgentBrowserResearch, { claimToken }', 1)

          p = 'convex/browserbase.ts'
          s = read(p)
          old = 'internal.browserbase.runAgentBrowserResearch, { agentRole: role }'
          if old not in s and 'internal.browserbase.runAgentBrowserResearch, { agentRole: role, claimToken }' not in s:
              raise RuntimeError('Browserbase nested delegation pattern missing')
          files[p] = s.replace(old, 'internal.browserbase.runAgentBrowserResearch, { agentRole: role, claimToken }', 1)

          p = 'convex/agentAutomation.ts'
          s = read(p)
          old = 'internal.browserbase.runAllAgentBrowserResearch, {}'
          if old in s:
              s = s.replace(old, 'internal.browserbase.runAllAgentBrowserResearch, { claimToken }', 1)
          files[p] = s

          p = 'convex/protocolAutoFix.ts'
          s = read(p)
          files[p] = s.replace('const platformFee = gross * 0.05;', 'const platformFee = gross * 0.03;')

          p = 'convex/fundConsolidation.ts'
          s = read(p)
          files[p] = s.replace('feeConfig?.platformFeePercent ?? 5', 'feeConfig?.platformFeePercent ?? 3')

          write_all()
          PY
      - name: Validate TypeScript before committing
        run: npx tsc --noEmit
      - name: Validate production build before committing
        run: npm run build
      - name: Commit validated fencing changes
        run: |
          git config user.name "IF Repair Bot"
          git config user.email "actions@github.com"
          git add convex/autonomous.ts convex/postContent.ts convex/facebook.ts convex/protocolAutoFix.ts convex/protocol.ts convex/imageGen.ts convex/fundConsolidation.ts convex/agentAutomation.ts convex/browserbase.ts convex/research.ts
          git diff --cached --check
          git commit -m "fix(convex): enforce lease claim at scheduled write boundaries"
          git push origin HEAD:agent1/p0-convex-durable-claim-current-main-r13

# One-shot standard public GitHub runner; workflow deletes itself.
name: Format IFund phase5 source
on:
  push:
    branches:
      - migration/phase5-frontend-parity
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'interplanetarysister/InterplanetaryFund'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/phase5-frontend-parity
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Format source, then retire this workflow
        run: npx --no-install prettier --write "src/**/*.{js,jsx,css}"
      - name: Commit only formatting and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/ifund-phase5-one-shot-format.yml
          git add src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format phase5 UI and remove one-time formatter"
          git push origin HEAD:migration/phase5-frontend-parity

name: PayPal AI Demo - Source Rebuild
# Owner-controlled build freeze: manual invocation only; no push/PR-triggered run.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build-demo-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: demo
      - name: TypeScript source validation
        run: npm run typecheck 2>&1 | tee typecheck.log
        working-directory: demo
      - name: Publish diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-typecheck-diagnostics
          path: demo/typecheck.log
          retention-days: 2
      - run: npm run build:worker
        working-directory: demo
      - name: Sandbox ledger and payment edge-case regression tests
        run: npm run test:ledger
        working-directory: demo
      - run: node --check worker/app.js
        working-directory: demo
      - name: Ensure source package contains no credential literals
        run: |
          if grep -R -E --include='*.ts' -e '-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|sk_live_[A-Za-z0-9]+' demo/worker demo/src; then
            echo 'Potential credential literal in source'; exit 1
          fi
      - name: Publish compiled Worker artifact for reproducibility
        uses: actions/upload-artifact@v4
        with:
          name: demo-worker-built-from-source
          path: |
            demo/worker/app.js
            demo/worker/app.js.map
            demo/worker/index.js
            demo/worker/assets.js
          retention-days: 7

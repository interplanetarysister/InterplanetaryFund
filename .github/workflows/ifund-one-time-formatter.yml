# One-shot formatter: removes this workflow from the resulting commit.
# Scoped to the existing migration branch; no deployment, secrets or database access.
name: IFund one-time formatting cleanup
on:
  push:
    branches:
      - migration/phase2-runtime-bootstrap-20261025
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'interplanetarysister/InterplanetaryFund'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/phase2-runtime-bootstrap-20261025
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Format previously failing source files
        run: npx --no-install prettier --write src/lib/legalPolicy.js src/pages/About.jsx src/pages/Privacy.jsx src/pages/Terms.jsx
      - name: Commit formatting and remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/ifund-one-time-formatter.yml
          git add src/lib/legalPolicy.js src/pages/About.jsx src/pages/Privacy.jsx src/pages/Terms.jsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format migration legal pages and remove one-time workflow"
          git push origin HEAD:migration/phase2-runtime-bootstrap-20261025

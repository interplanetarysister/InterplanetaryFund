name: Frontend production build and tests
# Owner-controlled build freeze: manual invocation only; no push/PR-triggered run.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm --prefix apps/web install --no-audit --no-fund
      - run: npm --prefix apps/web test
      - run: npm --prefix apps/web run build

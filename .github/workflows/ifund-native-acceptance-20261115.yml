name: IFund independent native candidates — QA only
# Explicit owner-triggered candidate QA against the exact checked-out commit.
# Never auto-run on merge; no store submission, payments, or Base44 changes.
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  VITE_SUPABASE_URL: https://ssibsfmtodgximseeqsv.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_x9AX2hyHLr_kb2mewuH69Q_T66poFyL' }}
  VITE_SUPABASE_OAUTH_PROVIDERS: ''
  VITE_NATIVE_OAUTH_VERIFIED: '0'
  VITE_NATIVE_APPLE_SIGNIN_READY: '0'
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify independent Android identity and store scope
        run: node apps/mobile/scripts/verify-mobile.mjs --candidate
      - name: Run native tests and generate offline React bundle
        working-directory: apps/web
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run test:mobile
          npm run build:mobile
          test -s dist-mobile/index.html
      - name: Compile separate Android debug APK and unsigned AAB
        working-directory: apps/mobile
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npx cap add android
          node scripts/verify-android-sdk.mjs
          node scripts/configure-native-project.mjs android
          npx @capacitor/assets generate --android --iconBackgroundColor '#0b1824' --splashBackgroundColor '#0b1824'
          npx cap sync android
          cd android
          ./gradlew assembleDebug bundleRelease
          bash "$GITHUB_WORKSPACE/apps/mobile/scripts/check-android-native-libs.sh" app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: IFund-Android-Candidate-Not-Store-Signed
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify independent iOS identity and SDK
        run: |
          node apps/mobile/scripts/verify-mobile.mjs --candidate
          xcodebuild -version
          major="$(xcodebuild -version | awk '/^Xcode /{split($2,a,".");print a[1]}')"
          test -n "$major" && test "$major" -ge 26
      - name: Run native tests and generate offline React bundle
        working-directory: apps/web
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run test:mobile
          npm run build:mobile
          test -s dist-mobile/index.html
      - name: Compile independent iOS Simulator app (no App Store signing)
        working-directory: apps/mobile
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npx cap add ios
          ruby -e 'require "xcodeproj"' || gem install xcodeproj -v 1.27.0 --no-document
          node scripts/configure-native-project.mjs ios
          test -s ios/App/App/PrivacyInfo.xcprivacy
          npx @capacitor/assets generate --ios --iconBackgroundColor '#0b1824' --splashBackgroundColor '#0b1824'
          npx cap sync ios
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO build
          test -d build/Build/Products/Debug-iphonesimulator/App.app
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/App.app ../../IFund-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: IFund-iOS-Simulator-Not-IPA
          path: apps/mobile/IFund-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 7

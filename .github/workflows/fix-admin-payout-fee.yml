name: Fix Admin Payout Fee
on:
  push:
    branches: [agent1/admin-session-integration-auth-repair]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Correct admin payout fallback fee
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='convex/treasury.ts';
          let s=fs.readFileSync(p,'utf8');
          const start=s.indexOf('export const requestAdminPayout');
          const end=s.indexOf('// Mutation: Create a deposit', start);
          if(start<0||end<0) throw new Error('admin payout block not found');
          let block=s.slice(start,end);
          if(!block.includes('feeConfigs?.platformFeePercent??5')) throw new Error('old 5% admin fallback not found');
          block=block.replace('feeConfigs?.platformFeePercent??5','feeConfigs?.platformFeePercent??3');
          block=block.replace('availableBalance:`${gross.toFixed(2)}`','availableBalance:`$${gross.toFixed(2)}`');
          block=block.replace('youReceive:`${net.toFixed(2)}`','youReceive:`$${net.toFixed(2)}`');
          block=block.replace('ourFee:`${totalFees.toFixed(2)}`','ourFee:`$${totalFees.toFixed(2)}`');
          s=s.slice(0,start)+block+s.slice(end);
          fs.writeFileSync(p,s);
          NODE
      - run: node scripts/verify-admin-session-integration-boundary.mjs
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Commit validated correction
        run: |
          git config user.name "IF Repair Bot"
          git config user.email "actions@github.com"
          git add convex/treasury.ts
          git commit -m "fix(finance): align admin payout fallback with 3 percent fee"
          git push origin HEAD:agent1/admin-session-integration-auth-repair

name: IFund payment reconciliation tests
on:
  push:
    branches:
      - repair/payment-reconciliation-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-payment-code:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install exact frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Run payment receipt and existing frontend tests
        working-directory: apps/web
        run: npm test
      - name: Verify production frontend bundle compiles
        working-directory: apps/web
        run: npm run build

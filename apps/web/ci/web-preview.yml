name: Web preview (apps/web)

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-preview.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: web-preview-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Uses npm ci once apps/web/package-lock.json is committed; until then
      # falls back to npm install (the lockfile could not be generated in the
      # authoring sandbox, which had no npm registry access).
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Build
        run: npm run build
        env:
          # Optional repo or environment variables (publishable values only).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy preview to Cloudflare Pages (ifund-web-preview)
        id: deploy
        if: env.HAS_CF == 'true'
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BRANCH="${{ github.head_ref }}"
          npx --yes wrangler@3 pages deploy apps/web/dist --project-name ifund-web-preview --branch "$BRANCH" | tee deploy.log
          URL=$(grep -Eo 'https://[a-zA-Z0-9._-]+\.pages\.dev' deploy.log | tail -n 1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: env.HAS_CF == 'true' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy.outputs.url }}";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Web preview (apps/web) deployed: ${url}`,
            });

      - name: Upload dist artifact (no Cloudflare secrets configured)
        if: env.HAS_CF != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
